#splash.out{opacity:0;pointer-events:none}
#app{position:relative;width:min(100vw,430px);height:100vh;height:100dvh;margin:auto}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;animation:in .35s ease;padding-top:env(safe-area-inset-top,0px)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.panel{position:relative;background:linear-gradient(rgba(150,18,190,.84),rgba(22,60,172,.9));border-radius:calc(var(--u)*7.2)}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:calc(var(--u)*.45);background:linear-gradient(#7df4f6,#c23ff0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
/* library */
#lib{padding:calc(var(--u)*6.2) calc(var(--u)*5.2) calc(var(--u)*3) }
.pill{height:calc(var(--u)*7.6);border-radius:99px;flex:none}
.pill input{width:100%;height:100%;background:none;border:0;outline:0;text-align:center;font:inherit;font-size:calc(var(--u)*5.2);color:#000;padding:0}
.pill input::placeholder{color:#000;opacity:1}
#lp{flex:1;min-height:0;margin-top:calc(var(--u)*4);display:flex;flex-direction:column}
.tabs{display:flex;justify-content:space-between;padding:calc(var(--u)*3.2) calc(var(--u)*7) 0}
.tabs button{background:none;border:0;font:inherit;font-size:calc(var(--u)*5);color:#000;padding:calc(var(--u)*1) 0;cursor:pointer;border-bottom:calc(var(--u)*.6) solid transparent}
.tabs button.on{border-color:#7df4f6}
#list{flex:1;overflow-y:auto;margin-top:calc(var(--u)*2);padding:0 calc(var(--u)*3.5) calc(var(--u)*3.5);scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*2);border-radius:calc(var(--u)*3.5);background:rgba(255,255,255,.1);margin-bottom:calc(var(--u)*2);cursor:pointer}
.row.on{background:rgba(125,244,246,.22);box-shadow:inset 3px 0 #7df4f6}
.row img{width:calc(var(--u)*12);height:calc(var(--u)*12);border-radius:calc(var(--u)*2.2);object-fit:cover;flex:none}
.tx{flex:1;min-width:0;color:#fff;font-family:system-ui,sans-serif}
.tx b{display:block;font-size:calc(var(--u)*4);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{display:block;font-size:calc(var(--u)*3.2);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:none;border:0;padding:calc(var(--u)*1.5);cursor:pointer;flex:none}
.hb svg{width:calc(var(--u)*5.5);height:calc(var(--u)*5.5);display:block}
.emp{text-align:center;font-size:calc(var(--u)*4.6);padding:calc(var(--u)*12) calc(var(--u)*8);margin:0}
/* player */
#ply{overflow-y:auto;scrollbar-width:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;height:calc(var(--u)*29.3);padding:calc(var(--u)*2) calc(var(--u)*3) 0 calc(var(--u)*3.6);flex:none}

 const rz=()=>{const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,1.5)*.75;cv.width=Math.max(2,Math.round(r.width*d));cv.height=Math.max(2,Math.round(r.height*d));gl.viewport(0,0,cv.width,cv.height)};
 im.onload=()=>{const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);
  [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(x=>gl.texParameteri(gl.TEXTURE_2D,x[0],x[1]));ready=true;rz();cv.classList.add("on")};
 im.src=src;addEventListener("resize",()=>{if(alive())rz()});
 const frame=now=>{if(!alive()){const x=gl.getExtension("WEBGL_lose_context");if(x)x.loseContext();return}requestAnimationFrame(frame);
  if(!ready||document.hidden||now-last<33)return;last=now;
  const ca=cv.width/cv.height,ia=im.width/im.height;
  gl.uniform1f(uT,still?0:((now-t0)/1000)%125.6637);gl.uniform1f(uK,keep?1:0);gl.uniform2f(uS,ca>ia?1:ca/ia,ca>ia?ia/ca:1);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)};
 requestAnimationFrame(frame);return true}
const bgUrl=el=>(getComputedStyle(el).backgroundImage.match(/url\(["']?(.*?)["']?\)$/)||[])[1];
try{if(!anim($("bgc"),bgUrl($("bg")),0,()=>$("bgc").isConnected))$("bg").classList.add("kb");
 anim($("sc"),bgUrl($("splash")),1,()=>$("sc").isConnected)}catch(e){$("bg").classList.add("kb")}
/* start */
if(mode==="buf")useBuf();
(async()=>{try{songs=(await tx("readonly",o=>o.getAll())).sort((a,b)=>a.added-b.added)}catch(e){}render();
 setTimeout(()=>{$("splash").classList.add("out");setTimeout(()=>$("splash").remove(),800)},2300);$("splash").onclick=()=>{$("splash").classList.add("out")}})();
if("serviceWorker"in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
